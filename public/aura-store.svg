<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#311042" />
      <stop offset="100%" stop-color="#0F0F1A" />
    </linearGradient>

    <!-- Glowing Arch / Crest Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="50%" stop-color="#5E5CE6" />
      <stop offset="100%" stop-color="#BF5AF2" />
    </linearGradient>

    <!-- Glass Specular Highlight -->
    <linearGradient id="glassHighlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.02" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- macOS Style Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- Inner Glass Highlight -->
  <rect x="34" y="34" width="444" height="224" rx="106" fill="url(#glassHighlight)" />

  <!-- Subtle Radial Glow behind symbol -->
  <circle cx="256" cy="256" r="140" fill="#5E5CE6" opacity="0.28" filter="url(#glow)" />

  <!-- Arch / Aura Store Diamond Crest Symbol -->
  <g transform="translate(256, 256)" filter="url(#glow)">
    <!-- Outer Diamond -->
    <path d="M 0 -110 L 105 0 L 0 110 L -105 0 Z" fill="none" stroke="url(#accentGrad)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" />
    <!-- Inner Core Symbol -->
    <path d="M 0 -55 L 55 0 L 0 55 L -55 0 Z" fill="url(#accentGrad)" opacity="0.9" />
    <!-- Little Accent Dots -->
    <circle cx="0" cy="0" r="14" fill="#FFFFFF" />
  </g>

  <!-- Subtle border ring -->
  <rect x="32" y="32" width="448" height="448" rx="108" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />
</svg>
