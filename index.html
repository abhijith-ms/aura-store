<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aura-store</title>
  </head>
  <body>
    <script>
      if (navigator.userAgent.includes('Electron')) {
        document.documentElement.classList.add('electron-frameless');
      }
    </script>
    <div id="electron-titlebar" class="electron-titlebar">
      <button id="electron-close-btn" class="electron-titlebar-close" aria-label="Close" type="button">✕</button>
    </div>
    <div id="root"></div>
    <script>
      document.getElementById('electron-close-btn').addEventListener('click', () => window.close());
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
